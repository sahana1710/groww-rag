    .scheme-toggle {

      background: var(--card);

      font-size: var(--chat);
      font-weight: 500;
      line-height: 1.45;
      text-align: left;
      color: var(--ink);

    .scheme-card[aria-selected="true"] {

      border-color: var(--mint);
      color: var(--mint);

    .rail {

      min-height: 0;

      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;

    .rail > * { flex: none; }
    .new-chat, .send, .scheme, .prompt, .scheme-card, .history button {

      background: var(--card);

    .new-chat {

      align-items: center;

      gap: 0.4rem;

      border-radius: 0.75rem;
      background: var(--mint-tint);
      color: var(--mint);

    .composer {

      margin: 0;

      height: 2.5rem;

    .composer input::placeholder {

    .send {

      height: 2.5rem;

      border: 0;

      color: var(--muted);

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);

    .backdrop { display: none; }
    @media (prefers-reduced-motion: no-preference) {

      .prompt, .bubble, .empty-thread { animation: settle 0.32s ease; }

    @keyframes settle {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }

    @media (max-width: 800px) {

      .main, .composer-wrap, .float-questions, .scheme-bar { padding-left: 1rem; padding-right: 1rem; }

      .rail {

        z-index: 30;

        bottom: 0;
        left: 0;

      .backdrop.open { display: block; position: fixed; inset: 0; background: rgba(23, 26, 44, 0.28); z-index: 20; }
    }

    const backdrop = document.getElementById("backdrop");
    const threadKey = "groww-rag-thread";
    const hiddenKey = "groww-rag-hidden-prompts";
    const schemeKey = "groww-rag-scheme";
    let selectedSchemeId = catalog.schemes.some((item) => item.id === sessionStorage.getItem(schemeKey))
      ? sessionStorage.getItem(schemeKey)
      : catalog.schemes[0].id;
    const schemeHints = [
      "hdfc large cap fund direct growth", "large cap",
      "hdfc flexi cap direct plan growth", "flexi cap", "hdfc equity fund",
      "hdfc elss tax saver fund direct plan growth", "elss", "tax saver",
      "hdfc mid cap fund direct growth", "mid cap"
    ];
    function loadThread() {
      try { return JSON.parse(sessionStorage.getItem(threadKey) || "[]"); }
      catch (_error) { return []; }
    }

    let thread = loadThread();

    function saveThread() {
      sessionStorage.setItem(threadKey, JSON.stringify(thread.slice(-20)));
    }

    function scrollChat() {
      const main = document.querySelector("main");
      main.scrollTop = main.scrollHeight;
    }

    function paintHistory() {
      historyEl.replaceChildren();
      if (!thread.length) {
        const empty = document.createElement("p");
        empty.textContent = "Questions you ask in this tab show up here.";
        historyEl.appendChild(empty);
        return;
      }
      for (let index = thread.length - 1; index >= 0; index -= 1) {
        const turn = thread[index];
        const button = document.createElement("button");
        button.type = "button";
        const title = document.createElement("strong");
        const label = turn.question.length > 42 ? turn.question.slice(0, 42) + "…" : turn.question;
        title.textContent = label;
        button.append(title);
        button.addEventListener("click", () => {
          const node = document.getElementById("turn-" + index);
          if (node) node.scrollIntoView({block: "nearest"});
          closeRail();
        });
        historyEl.appendChild(button);
      }
    }

    function paintThread() {
      const column = document.querySelector(".column");
      column.classList.toggle("is-empty", !thread.length);
      answer.replaceChildren();
      if (!thread.length) {
        const empty = document.createElement("p");
        empty.className = "empty-thread";
        empty.textContent = "What would you like to know today?";
        answer.appendChild(empty);
        return;
      }
      thread.forEach((turn, index) => {
        const block = document.createElement("article");
        block.className = "turn";
        block.id = "turn-" + index;
        const asked = document.createElement("p");
        asked.className = "bubble user";
        asked.textContent = turn.question;
        const bot = document.createElement("div");
        bot.className = "bubble bot";
        const body = document.createElement("p");
        body.textContent = shownAnswer(turn.answer || "Looking that up…");
        bot.appendChild(body);
        if (turn.source) {
          const link = document.createElement("a");
          link.href = turn.source;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = turn.source;
          bot.appendChild(link);
        }
        if (turn.fetched) {
          const date = document.createElement("p");
          date.textContent = "Last updated from sources: " + turn.fetched + ".";
          bot.appendChild(date);
        }
        block.append(asked, bot);
        answer.appendChild(block);
      });
      scrollChat();
    }

    function loadHidden() {
      try { return JSON.parse(sessionStorage.getItem(hiddenKey) || "[]"); }
      catch (_error) { return []; }
    }

    let hiddenPrompts = loadHidden();

    function hidePrompt(text) {
      if (!hiddenPrompts.includes(text)) hiddenPrompts.push(text);
      sessionStorage.setItem(hiddenKey, JSON.stringify(hiddenPrompts));
      paintPrompts();
    }

    function mentionsScheme(text) {
      const lower = text.toLowerCase();
      return schemeHints.some((hint) => new RegExp("(?<![a-z0-9])" + hint + "(?![a-z0-9])").test(lower));
    }

    function questionForApi(text) {
      const lower = text.toLowerCase();
      const fundHouse = /\bfund house\b/.test(lower) || /\bamc\b/.test(lower) || lower.includes("about hdfc mutual fund");
      const help = lower.includes("capital-gain") || lower.includes("capital gain") || lower.includes("tax statement") || fundHouse;
      if (help || mentionsScheme(text)) return text;
      const scheme = catalog.schemes.find((item) => item.id === selectedSchemeId);
      const body = text.replace(/[\s?]+$/, "");
      if (scheme.id === "amc") return body + " for the HDFC Mutual Fund fund house?";
      return body + " for " + scheme.name + "?";
    }

    function chip(question, help) {
      const shown = questionForApi(question.label || question.text);
      const card = document.createElement("div");
      card.className = help ? "prompt help" : "prompt";
      const ask = document.createElement("button");
      ask.type = "button";
      ask.className = "prompt-ask";
      ask.textContent = shown;
      ask.addEventListener("click", () => submitQuestion(shown));
      const close = document.createElement("button");
      close.type = "button";
      close.className = "prompt-x";
      close.setAttribute("aria-label", "Remove this question");
      close.innerHTML = '<span class="material-symbols-outlined">close</span>';
      close.addEventListener("click", () => hidePrompt(question.text));
      card.append(ask, close);
      return card;
    }

    function paintPrompts() {
      const scheme = catalog.schemes.find((item) => item.id === selectedSchemeId);
      const questions = scheme.questions.slice(0, 3).filter((question) => !hiddenPrompts.includes(question.text));
      promptsEl.replaceChildren(...questions.map((question) => chip(question, question === catalog.help)));
      promptsEl.hidden = questions.length === 0;
    }

    function paintSchemeCards() {
      const scheme = catalog.schemes.find((item) => item.id === selectedSchemeId);
      schemeSelected.textContent = scheme.name;
      schemeCards.replaceChildren(...catalog.schemes.map((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "scheme-card";
        button.setAttribute("role", "option");
        button.setAttribute("aria-selected", item.id === selectedSchemeId ? "true" : "false");
        button.textContent = item.name;
        button.addEventListener("click", () => chooseScheme(item.id));
        return button;
      }));
    }

    function chooseScheme(id) {
      selectedSchemeId = id;
      sessionStorage.setItem(schemeKey, id);
      paintSchemeCards();
      paintPrompts();
      setSchemeOpen(false);
    }

    function setSchemeOpen(open) {
      schemeBar.classList.toggle("collapsed", !open);
      schemeToggle.setAttribute("aria-expanded", open ? "true" : "false");
      schemeToggle.setAttribute("aria-label", open ? "Hide schemes" : "Show schemes");
      document.getElementById("scheme-heading").setAttribute("aria-hidden", open ? "false" : "true");
      schemeSelected.setAttribute("aria-hidden", open ? "true" : "false");
      schemeCards.inert = !open;
      sessionStorage.setItem("groww-rag-scheme-bar", open ? "1" : "0");
    }

    function shownAnswer(text) {
      if (text === "Looking that up…") return text;
      return text.replace(/^Facts only\.\s*/i, "");
    }

    function answerText(payload) {
      const lines = (payload.answer || "").split("\n").map((line) => line.trim()).filter(Boolean);
      return lines.filter((line) => !line.startsWith("Source:") && !line.startsWith("Last updated from sources:")).join(" ");
    }

    async function submitQuestion(question) {
      const text = question.trim();
      if (!text) return;
      input.value = "";
      send.disabled = true;
      thread.push({question: text, answer: "Looking that up…", source: "", fetched: ""});
      saveThread();
      paintHistory();
      paintThread();
      const index = thread.length - 1;
      try {
        const response = await fetch("/api/ask", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({question: questionForApi(text)})
        });
        const payload = response.status === 200 || response.status === 400 ? await response.json() : {};
        if (response.status === 503) {
          thread[index].answer = "Index is not ready.";
        } else if (response.status === 400) {
          thread[index].answer = "Ask one factual question, up to 500 characters.";
        } else {
          thread[index].answer = answerText(payload);
          thread[index].source = payload.source_url || "";
          thread[index].fetched = payload.fetched_at || "";
        }
        saveThread();
        paintHistory();
        paintThread();
      } finally {
        send.disabled = !input.value.trim();
      }
    }

    function closeRail() {
      rail.classList.remove("open");
      backdrop.classList.remove("open");
    }

    input.addEventListener("input", () => {
      send.disabled = !input.value.trim();
    });
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      submitQuestion(input.value);
    });
    document.getElementById("new-chat").addEventListener("click", () => {
      input.value = "";
      send.disabled = true;
      thread = [];
      hiddenPrompts = [];
      sessionStorage.removeItem(hiddenKey);
      saveThread();
      paintPrompts();
      paintHistory();
      paintThread();
      closeRail();
      input.focus();
    });
    document.getElementById("collapse").addEventListener("click", () => {
      rail.classList.add("collapsed");
      sessionStorage.setItem("groww-rag-rail", "1");
    });
    document.getElementById("logo-btn").addEventListener("click", () => {
      if (!rail.classList.contains("collapsed")) return;
      rail.classList.remove("collapsed");
      sessionStorage.setItem("groww-rag-rail", "0");
    });
    if (sessionStorage.getItem("groww-rag-rail") === "1") rail.classList.add("collapsed");
    document.getElementById("menu").addEventListener("click", () => {
      rail.classList.toggle("open");
      backdrop.classList.toggle("open");
    });
    backdrop.addEventListener("click", closeRail);

    async function showReady() {
      const response = await fetch("/api/health");
      if (response.status === 503 && !thread.length) {
        thread = [{question: "", answer: "Index is not ready.", source: "", fetched: ""}];
        paintThread();
      }
    }

    schemeBar.addEventListener("click", (event) => {
      if (event.target.closest(".scheme-card")) return;
      setSchemeOpen(schemeBar.classList.contains("collapsed"));
    });
    setSchemeOpen(sessionStorage.getItem("groww-rag-scheme-bar") !== "0");
    paintSchemeCards();
    paintPrompts();
    paintHistory();
    paintThread();
    showReady();
  </script>
</body>
</html>
