[project]
name = "groww-rag"
version = "1.0.0"
description = "Facts-only assistant for four HDFC Mutual Fund Direct Growth schemes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "fastembed>=0.6",
    "groq>=0.11",
]

[tool.vercel]
entrypoint = "app.api:app"
